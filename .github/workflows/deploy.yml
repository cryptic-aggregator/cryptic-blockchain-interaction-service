name: CI/CD Deploy NodeJs

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/cryptic-blockchain-interaction-service:latest

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.4
        with:
          host: 20.215.241.137
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          port: 22
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/cryptic-blockchain-interaction-service:latest
            docker stop cryptic-blockchain-interaction-service || true
            docker rm cryptic-blockchain-interaction-service || true
            docker run -d --name cryptic-blockchain-interaction-service -p 4000:4001 ${{ secrets.DOCKER_USERNAME }}/cryptic-blockchain-interaction-service:latest
      
